<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>iaio Test | Bug Report</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;700;800&family=Space+Mono:wght@400;700&display=swap"
        rel="stylesheet">
    <style>
        :root {
            --bg: #050810;
            --surface: #080d1a;
            --cyan: #00f0ff;
            --violet: #7b5cff;
            --text: #e8eaf6;
            --muted: #5a6080;
            --border: rgba(0, 240, 255, 0.12);
            --error: #ff3cac;
            --warn: #ffc400;
            --ok: #00c875;
            --info-color: #00b8d9;
        }

        body {
            margin: 0;
            background: var(--bg);
            color: var(--text);
            font-family: 'Plus Jakarta Sans', sans-serif;
            overflow: hidden;
        }

        .loading {
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--cyan);
            font-family: 'Space Mono', monospace;
            letter-spacing: 0.2em;
        }

        #root {
            display: none;
            height: 100vh;
            flex-direction: column;
        }

        header {
            padding: 16px 24px;
            background: var(--surface);
            border-bottom: 1px solid var(--border);
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .logo-dot {
            width: 8px;
            height: 8px;
            background: var(--cyan);
            border-radius: 50%;
            box-shadow: 0 0 10px var(--cyan);
        }

        .logo-text {
            font-weight: 800;
            letter-spacing: 0.05em;
            color: var(--cyan);
        }

        .content {
            display: flex;
            flex: 1;
            overflow: hidden;
        }

        /* ── Left Panel ── */
        .sidebar {
            width: 500px;
            border-right: 1px solid var(--border);
            overflow-y: auto;
            background: var(--surface);
            display: flex;
            flex-direction: column;
            flex-shrink: 0;
        }

        /* ── Right Panel ── */
        .main {
            flex: 1;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            background: var(--bg);
        }

        .label {
            font-size: 10px;
            color: var(--muted);
            text-transform: uppercase;
            letter-spacing: 0.1em;
            margin-bottom: 8px;
            font-weight: 700;
        }

        .snapshot-container {
            padding: 24px 24px 0 24px;
            display: flex;
            flex-direction: column;
            flex: 1;
        }

        .screenshot {
            width: 100%;
            object-fit: contain;
            border-radius: 8px;
            border: 1px solid var(--border);
            display: block;
            background-color: var(--bg);
        }

        .sidebar-details {
            padding: 24px;
            display: flex;
            flex-direction: column;
            gap: 24px;
            border-top: 1px solid var(--border);
            margin-top: 24px;
            background: rgba(0, 0, 0, 0.15);
        }

        .notes-box {
            background: rgba(255, 255, 255, 0.02);
            border: 1px solid var(--border);
            padding: 16px;
            border-radius: 8px;
            font-size: 14px;
            line-height: 1.6;
            white-space: pre-wrap;
            color: var(--text);
        }

        .ai-box {
            background: rgba(0, 240, 255, 0.03);
            border: 1px solid var(--border);
            padding: 16px;
            border-radius: 8px;
            color: var(--cyan);
            font-family: 'Space Mono', monospace;
            font-size: 12px;
            line-height: 1.6;
            white-space: pre-wrap;
        }

        h1 {
            font-size: 20px;
            margin: 0;
            color: var(--cyan);
            padding: 24px 24px 0;
        }

        /* ── Tabs ── */
        .tabs {
            display: flex;
            border-bottom: 1px solid var(--border);
            padding: 0 12px;
            margin-top: 16px;
            flex-shrink: 0;
        }

        .tab-btn {
            padding: 12px 20px;
            background: none;
            border: none;
            border-bottom: 2px solid transparent;
            border-top: 2px solid transparent;
            color: var(--muted);
            font-size: 11px;
            font-weight: 700;
            letter-spacing: 0.1em;
            text-transform: uppercase;
            cursor: pointer;
            transition: all 0.2s;
            white-space: nowrap;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .tab-btn.active {
            color: var(--cyan);
            border-bottom-color: var(--cyan);
        }

        .tab-btn:hover:not(.active) {
            color: var(--text);
        }

        .tab-count {
            background: rgba(0, 240, 255, 0.1);
            color: var(--cyan);
            border-radius: 10px;
            padding: 1px 7px;
            font-size: 10px;
            font-family: 'Space Mono', monospace;
        }

        .tab-btn:not(.active) .tab-count {
            background: rgba(255, 255, 255, 0.05);
            color: var(--muted);
        }

        .tab-content {
            display: none;
            flex: 1;
            overflow-y: auto;
            box-sizing: border-box;
        }

        .tab-content.active {
            display: flex;
            flex-direction: column;
        }

        /* ── Info Tab ── */
        #tab-info {
            padding: 24px;
            gap: 24px;
        }

        #tab-info .info-row {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        #tab-info .info-val {
            font-family: 'Space Mono', monospace;
            font-size: 13px;
            color: var(--text);
            word-break: break-all;
            line-height: 1.5;
        }

        /* ── Console Tab ── */
        #tab-console {
            background-color: #020408;
            padding: 8px 0;
            gap: 0;
        }

        .log-line {
            display: flex;
            align-items: baseline;
            gap: 8px;
            padding: 4px 20px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.03);
        }

        .log-line:hover {
            background: rgba(255, 255, 255, 0.02);
        }

        .log-icon {
            width: 10px;
            flex-shrink: 0;
            text-align: center;
            font-size: 10px;
        }

        .log-time {
            font-size: 10px;
            color: var(--muted);
            flex-shrink: 0;
            font-family: 'Space Mono', monospace;
        }

        .log-badge {
            font-size: 10px;
            font-weight: 700;
            font-family: 'Space Mono', monospace;
            flex-shrink: 0;
            padding: 0 4px;
            border-radius: 3px;
        }

        .log-msg {
            flex: 1;
            min-width: 0;
            word-break: break-all;
            font-family: 'Space Mono', monospace;
            font-size: 12px;
            line-height: 1.55;
        }

        .log-error { background: rgba(255, 60, 172, 0.04); }
        .log-warn  { background: rgba(255, 196, 0, 0.03); }
        .log-info  {}

        .log-error .log-icon { color: var(--error); }
        .log-warn  .log-icon { color: var(--warn); }
        .log-info  .log-icon { color: var(--muted); }

        .log-error .log-badge { color: var(--error); background: rgba(255,60,172,0.12); }
        .log-warn  .log-badge { color: var(--warn);  background: rgba(255,196,0,0.12); }
        .log-info  .log-badge { color: var(--muted); background: rgba(255,255,255,0.06); }

        .log-error .log-msg { color: var(--error); }
        .log-warn  .log-msg { color: var(--warn); }
        .log-info  .log-msg { color: var(--text); }

        /* ── Network Tab ── */
        #tab-network {
            padding: 0;
        }

        .net-header {
            display: grid;
            grid-template-columns: 56px 56px 1fr 80px;
            gap: 8px;
            padding: 8px 20px;
            border-bottom: 1px solid var(--border);
            background: var(--surface);
            position: sticky;
            top: 0;
            z-index: 1;
        }

        .net-header span {
            font-size: 10px;
            font-weight: 700;
            letter-spacing: 0.07em;
            text-transform: uppercase;
            color: var(--muted);
        }

        .net-row {
            display: grid;
            grid-template-columns: 56px 56px 1fr 80px;
            gap: 8px;
            padding: 7px 20px;
            border-bottom: 1px solid rgba(0, 240, 255, 0.04);
            align-items: center;
        }

        .net-row:hover {
            background: rgba(255, 255, 255, 0.02);
        }

        .net-method {
            background: rgba(123, 92, 255, 0.12);
            color: var(--violet);
            border-radius: 4px;
            padding: 2px 5px;
            font-size: 10px;
            font-weight: 700;
            font-family: 'Space Mono', monospace;
            text-align: center;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .net-status {
            border-radius: 4px;
            padding: 2px 5px;
            font-size: 10px;
            font-weight: 700;
            font-family: 'Space Mono', monospace;
            text-align: center;
        }

        .net-url {
            font-family: 'Space Mono', monospace;
            font-size: 11px;
            color: var(--text);
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .net-time {
            font-size: 10px;
            color: var(--muted);
            text-align: right;
            font-family: 'Space Mono', monospace;
        }

        /* ── DOM Tab ── */
        #tab-dom {
            background-color: var(--surface);
            padding: 24px;
        }

        .code-view {
            font-family: 'Space Mono', monospace;
            font-size: 13px;
            line-height: 1.6;
        }

        /* DOM Tree — Chrome DevTools dark mode style */
        .dom-tree-root {
            font-family: 'Space Mono', monospace;
            font-size: 12px;
            line-height: 1.7;
            color: #e8eaf6;
        }

        .dom-node {
            margin-left: 12px;
        }

        .dom-row {
            display: flex;
            align-items: baseline;
            padding: 1px 4px;
            border-radius: 2px;
            white-space: pre;
            cursor: default;
            min-height: 20px;
        }

        .dom-row:hover {
            background: rgba(255, 255, 255, 0.06);
        }

        .dom-caret {
            display: inline-block;
            width: 14px;
            flex-shrink: 0;
            color: #8a9bb0;
            font-size: 9px;
            cursor: pointer;
            transition: transform 0.15s;
            user-select: none;
            text-align: center;
        }

        .dom-caret.open {
            transform: rotate(90deg);
        }

        .dom-bracket   { color: #808080; }
        .dom-tagname   { color: #e9a87c; }
        .dom-attr-name { color: #9bbbdc; }
        .dom-attr-eq   { color: #e8eaf6; }
        .dom-attr-val  { color: #f28b54; }
        .dom-text      { color: rgba(232, 234, 246, 0.55); font-style: italic; }
        .dom-comment   { color: #6a9955; font-style: italic; }

        .dom-children {
            display: none;
            border-left: 1px solid rgba(255, 255, 255, 0.08);
            margin-left: 7px;
        }

        .dom-node.open > .dom-children {
            display: block;
        }

        /* ── Empty state ── */
        .empty-state {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100%;
            gap: 10px;
            color: var(--muted);
            font-size: 13px;
            padding: 48px;
        }

        .empty-state-icon {
            font-size: 28px;
            opacity: 0.25;
        }
    </style>
</head>

<body>
    <div id="loader" class="loading">LOADING REPORT...</div>

    <div id="root">
        <header>
            <div class="logo-dot"></div>
            <div class="logo-text">iaio Test <span style="opacity:0.3; font-weight:400; margin-left:8px;">v2.0</span></div>
        </header>

        <div class="content">
            <!-- ── Left Panel ── -->
            <div class="sidebar">
                <div class="snapshot-container">
                    <div class="label">Evidence Snapshot</div>
                    <img id="screenshot" class="screenshot" alt="Snapshot">
                </div>

                <div class="sidebar-details">
                    <div>
                        <div class="label">User Description</div>
                        <div id="notes" class="notes-box"></div>
                    </div>

                    <div>
                        <div class="label">AI Hypothesis</div>
                        <div id="aiSuggestion" class="ai-box"></div>
                    </div>
                </div>
            </div>

            <!-- ── Right Panel ── -->
            <div class="main">
                <h1 id="title"></h1>

                <div class="tabs">
                    <button class="tab-btn active" data-target="tab-info">INFO</button>
                    <button class="tab-btn" data-target="tab-console">
                        CONSOLE <span id="console-count" class="tab-count" style="display:none"></span>
                    </button>
                    <button class="tab-btn" data-target="tab-network">
                        NETWORK <span id="network-count" class="tab-count" style="display:none"></span>
                    </button>
                    <button class="tab-btn" data-target="tab-dom">DOM INSPECTOR</button>
                </div>

                <!-- INFO -->
                <div id="tab-info" class="tab-content active">
                    <div class="info-row">
                        <div class="label">Target URL</div>
                        <div id="meta-url" class="info-val" style="color: var(--cyan);"></div>
                    </div>
                    <div class="info-row">
                        <div class="label">System Platform</div>
                        <div id="meta-platform" class="info-val"></div>
                    </div>
                    <div class="info-row">
                        <div class="label">Viewport Resolution</div>
                        <div id="meta-resolution" class="info-val"></div>
                    </div>
                    <div class="info-row">
                        <div class="label">Language</div>
                        <div id="meta-language" class="info-val"></div>
                    </div>
                    <div class="info-row" style="flex:1;">
                        <div class="label">User Agent</div>
                        <div id="meta-ua" class="info-val" style="color: var(--muted);"></div>
                    </div>
                </div>

                <!-- CONSOLE -->
                <div id="tab-console" class="tab-content code-view"></div>

                <!-- NETWORK -->
                <div id="tab-network" class="tab-content"></div>

                <!-- DOM INSPECTOR -->
                <div id="tab-dom" class="tab-content code-view"></div>
            </div>
        </div>
    </div>

    <script>
        // ── Tab Switching ──────────────────────────────────────────────────────
        document.querySelectorAll('.tab-btn').forEach(btn => {
            btn.addEventListener('click', (e) => {
                const target = e.currentTarget.dataset.target
                document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'))
                document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'))
                e.currentTarget.classList.add('active')
                document.getElementById(target).classList.add('active')
            })
        })

        // ── Helpers ───────────────────────────────────────────────────────────
        function escapeHTML(str) {
            return String(str).replace(/[&<>'"]/g, tag => ({
                '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;'
            }[tag] || tag))
        }

        function fmtTime(ts) {
            try {
                return new Date(ts).toLocaleTimeString([], {
                    hour: '2-digit', minute: '2-digit', second: '2-digit'
                })
            } catch { return '' }
        }

        // ── Console Rendering ─────────────────────────────────────────────────
        function renderConsole(entries, fallbackStr) {
            const container = document.getElementById('tab-console')

            // Use structured entries if available (new format)
            if (entries && entries.length > 0) {
                document.getElementById('console-count').textContent = entries.length
                document.getElementById('console-count').style.display = 'inline'

                container.innerHTML = entries.map(entry => {
                    const level = entry.level || 'log'
                    const icon = level === 'error' ? '●' : level === 'warn' ? '▲' : '·'
                    const badge = level.toUpperCase()
                    return `<div class="log-line log-${level}">
                        <span class="log-icon">${icon}</span>
                        <span class="log-time">${fmtTime(entry.timestamp)}</span>
                        <span class="log-badge">${badge}</span>
                        <span class="log-msg">${escapeHTML(entry.message)}</span>
                    </div>`
                }).join('')
                return
            }

            // Fallback: parse the legacy string format
            if (fallbackStr) {
                const lines = fallbackStr.split('\n').filter(l => l.trim())
                container.innerHTML = lines.map(line => {
                    const u = line.toUpperCase()
                    const level = (u.includes('ERROR') || u.includes('FAILED')) ? 'error'
                        : u.includes('WARN') ? 'warn' : 'log'
                    const icon = level === 'error' ? '●' : level === 'warn' ? '▲' : '·'
                    return `<div class="log-line log-${level}">
                        <span class="log-icon">${icon}</span>
                        <span class="log-msg">${escapeHTML(line)}</span>
                    </div>`
                }).join('')
                return
            }

            container.innerHTML = `<div class="empty-state"><span class="empty-state-icon">∅</span><span>No console activity captured</span></div>`
        }

        // ── Network Rendering ─────────────────────────────────────────────────
        function renderNetwork(entries, fallbackStr) {
            const container = document.getElementById('tab-network')

            // Use structured entries if available
            if (entries && entries.length > 0) {
                document.getElementById('network-count').textContent = entries.length
                document.getElementById('network-count').style.display = 'inline'

                const rows = entries.map(entry => {
                    const status = entry.status
                    const statusColor = !status ? '#5a6080'
                        : status < 300 ? '#00c875'
                        : status < 400 ? '#00b8d9'
                        : '#ff3cac'

                    let shortUrl = entry.url
                    try {
                        const u = new URL(entry.url)
                        shortUrl = u.pathname + (u.search || '')
                    } catch {}

                    const statusDisplay = entry.error ? 'ERR' : (status !== undefined ? status : '—')

                    return `<div class="net-row">
                        <span class="net-method">${escapeHTML(entry.method || '?')}</span>
                        <span class="net-status" style="background:${statusColor}22;color:${statusColor}">${statusDisplay}</span>
                        <span class="net-url" title="${escapeHTML(entry.url)}">${escapeHTML(shortUrl)}</span>
                        <span class="net-time">${fmtTime(entry.timestamp)}</span>
                    </div>`
                }).join('')

                container.innerHTML = `
                    <div class="net-header">
                        <span>Method</span>
                        <span>Status</span>
                        <span>URL</span>
                        <span style="text-align:right">Time</span>
                    </div>
                    ${rows}
                `
                return
            }

            // Fallback: show raw string
            if (fallbackStr) {
                container.innerHTML = `<pre style="padding:24px;font-family:'Space Mono',monospace;font-size:12px;color:var(--violet);white-space:pre-wrap;word-break:break-all;">${escapeHTML(fallbackStr)}</pre>`
                return
            }

            container.innerHTML = `<div class="empty-state"><span class="empty-state-icon">∅</span><span>No network activity captured</span></div>`
        }

        // ── DOM Tree Rendering ────────────────────────────────────────────────
        function buildAttrsHTML(attrs) {
            return Array.from(attrs).map(a =>
                ` <span class="dom-attr-name">${escapeHTML(a.name)}</span><span class="dom-attr-eq">=</span><span class="dom-attr-val">"${escapeHTML(a.value)}"</span>`
            ).join('')
        }

        function createDOMNode(node, depth) {
            if (node.nodeType === Node.TEXT_NODE) {
                const text = node.textContent.trim()
                if (!text) return null
                const row = document.createElement('div')
                row.className = 'dom-row'
                row.innerHTML = `<span class="dom-caret" style="visibility:hidden">▶</span><span class="dom-text">"${escapeHTML(text)}"</span>`
                return row
            }

            if (node.nodeType === Node.COMMENT_NODE) {
                const row = document.createElement('div')
                row.className = 'dom-row'
                row.innerHTML = `<span class="dom-caret" style="visibility:hidden">▶</span><span class="dom-comment">&lt;!-- ${escapeHTML(node.textContent.trim())} --&gt;</span>`
                return row
            }

            if (node.nodeType !== Node.ELEMENT_NODE) return null

            const tag = node.tagName.toLowerCase()
            const attrsHTML = buildAttrsHTML(node.attributes)
            const hasChildren = node.childNodes.length > 0
            const isOpen = depth === 0

            const container = document.createElement('div')
            container.className = 'dom-node' + (isOpen ? ' open' : '')
            if (depth === 0) container.style.marginLeft = '0'

            const row = document.createElement('div')
            row.className = 'dom-row'

            const caretHTML = hasChildren
                ? `<span class="dom-caret${isOpen ? ' open' : ''}">▶</span>`
                : `<span class="dom-caret" style="visibility:hidden">▶</span>`

            const voidTags = new Set(['area','base','br','col','embed','hr','img','input','link','meta','param','source','track','wbr'])
            if (voidTags.has(tag)) {
                row.innerHTML = `${caretHTML}<span class="dom-bracket">&lt;</span><span class="dom-tagname">${escapeHTML(tag)}</span>${attrsHTML}<span class="dom-bracket"> /&gt;</span>`
                container.appendChild(row)
                return container
            }

            const openTagHTML = `<span class="dom-bracket">&lt;</span><span class="dom-tagname">${escapeHTML(tag)}</span>${attrsHTML}<span class="dom-bracket">&gt;</span>`
            row.innerHTML = `${caretHTML}${openTagHTML}`
            container.appendChild(row)

            if (hasChildren) {
                const childrenDiv = document.createElement('div')
                childrenDiv.className = 'dom-children'

                Array.from(node.childNodes).forEach(child => {
                    const el = createDOMNode(child, depth + 1)
                    if (el) childrenDiv.appendChild(el)
                })

                const closeRow = document.createElement('div')
                closeRow.className = 'dom-row'
                closeRow.innerHTML = `<span class="dom-caret" style="visibility:hidden">▶</span><span class="dom-bracket">&lt;/</span><span class="dom-tagname">${escapeHTML(tag)}</span><span class="dom-bracket">&gt;</span>`
                childrenDiv.appendChild(closeRow)
                container.appendChild(childrenDiv)

                row.addEventListener('click', () => {
                    const nowOpen = container.classList.toggle('open')
                    row.querySelector('.dom-caret').classList.toggle('open', nowOpen)
                })
            }

            return container
        }

        function renderDOMTree(domString) {
            const container = document.getElementById('tab-dom')
            if (!domString) {
                container.innerHTML = `<div class="empty-state"><span class="empty-state-icon">∅</span><span>No DOM captured</span></div>`
                return
            }

            try {
                const parser = new DOMParser()
                const doc = parser.parseFromString(domString, 'text/html')
                const root = document.createElement('div')
                root.className = 'dom-tree-root'

                Array.from(doc.body.childNodes).forEach(node => {
                    const el = createDOMNode(node, 0)
                    if (el) root.appendChild(el)
                })

                container.innerHTML = ''
                container.appendChild(root)
            } catch {
                container.innerHTML = `<div style="color:var(--error);padding:24px;">Failed to parse DOM.</div>`
            }
        }

        // ── Data Binding ──────────────────────────────────────────────────────
        function loadReport() {
            try {
                const rawBase64 = document.getElementById('report-data').textContent.trim()
                if (!rawBase64) throw new Error('No data injected')

                const decodedString = decodeURIComponent(escape(atob(rawBase64)))
                const report = JSON.parse(decodedString)

                document.getElementById('title').textContent = report.title || 'Bug Report'
                document.getElementById('notes').textContent = report.notes || 'No user description provided.'
                document.getElementById('aiSuggestion').textContent = report.aiSuggestion || 'No AI analysis available.'

                if (report.screenshotFile) {
                    document.getElementById('screenshot').src = `/uploads/${report.screenshotFile}`
                } else if (report.screenshotBase64) {
                    document.getElementById('screenshot').src = report.screenshotBase64
                } else {
                    document.getElementById('screenshot').style.display = 'none'
                }

                document.getElementById('meta-url').textContent = report.url || 'Unknown'
                document.getElementById('meta-platform').textContent = report.systemInfo?.platform || 'Unknown'
                document.getElementById('meta-resolution').textContent = report.resolution || 'Unknown'
                document.getElementById('meta-language').textContent = report.systemInfo?.language || 'Unknown'
                document.getElementById('meta-ua').textContent = report.systemInfo?.userAgent || 'Unknown'

                renderConsole(report.consoleEntries, report.consoleLogs)
                renderNetwork(report.networkEntries, report.networkLogs)
                renderDOMTree(report.dom)

                document.getElementById('loader').style.display = 'none'
                document.getElementById('root').style.display = 'flex'
            } catch (e) {
                console.error(e)
                document.getElementById('loader').textContent = 'ERROR LOADING REPORT'
            }
        }

        loadReport()
    </script>
</body>

</html>
